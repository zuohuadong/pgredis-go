name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pg
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: pgredis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pg" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -count=1
        env:
          PGREDIS_TEST_DSN: postgres://pg:pg@127.0.0.1:5432/pgredis_test?sslmode=disable
